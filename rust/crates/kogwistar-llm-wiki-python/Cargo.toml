[package]
name = "kogwistar-llm-wiki-python"
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.83"

[workspace]

[lib]
name = "_kogwistar_llm_wiki_rust"
crate-type = ["cdylib"]

[dependencies]
kogwistar-llm-wiki-port = { path = "../kogwistar-llm-wiki-port" }
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py312", "generate-import-lib"] }
serde_json = "1"
