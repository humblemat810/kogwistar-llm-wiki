[workspace]
resolver = "2"
members = ["crates/kogwistar-llm-wiki-port"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.83"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v5"] }
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py312", "generate-import-lib"] }
