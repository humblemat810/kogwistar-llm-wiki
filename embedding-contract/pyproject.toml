[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-embedding-contract"
version = "0.1.0"
description = "Stdlib-only v1 contract for LLM-Wiki embedding services"
requires-python = ">=3.13"

[tool.setuptools]
package-dir = {"" = "../src"}

[tool.setuptools.packages.find]
where = ["../src"]
include = ["llm_wiki_embedding_contract*"]
