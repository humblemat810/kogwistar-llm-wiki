# Add this overlay on a host with NVIDIA Container Toolkit:
#   docker compose -f compose.yml -f compose.multimodal.yml \
#     -f compose.representation-cuda.yml up --build
services:
  representation:
    build:
      args:
        LLM_WIKI_REPRESENTATION_TORCH_BACKEND: ${LLM_WIKI_REPRESENTATION_TORCH_BACKEND:-cu128}
    environment:
      LLM_WIKI_REPRESENTATION_DEVICE: cuda
      LLM_WIKI_REPRESENTATION_TORCH_BACKEND: ${LLM_WIKI_REPRESENTATION_TORCH_BACKEND:-cu128}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
