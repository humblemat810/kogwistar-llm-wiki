[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kogwistar-llm-wiki"
version = "0.3.2"
description = "LLM-Wiki: a continuously-learning knowledge system built on Kogwistar"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["knowledge-graph", "llm", "obsidian", "kogwistar", "wiki"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
# Runtime bundle: this package imports the sibling repos at import time and the
# bootstrap installs them editable before the root package.
dependencies = [
    "kogwistar",
    "graph-knowledge-doc-parser",
    "kogwistar-obsidian-sink",
]

[project.optional-dependencies]
chromadb = ["chromadb>=0.6"]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
agent = [
    "fastmcp==3.0.0",
]
multimodal = [
    # PyPI resolves this portable default to a CPU-capable wheel. CUDA builds
    # use the versioned profiles under requirements/multimodal because their
    # wheel index must match the operator's selected runtime target.
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers>=4.57.0",
    "qwen-vl-utils>=0.0.14",
    "accelerate>=1.10,<2",
    "Pillow>=10",
    "huggingface_hub>=0.26",
    "bitsandbytes>=0.45",
]
# Explicit CPU profile dependencies. Install the selected Torch wheel first
# from requirements/multimodal/torch-cpu.txt; a PEP 508 extra cannot select a
# package index, and plain PyPI's Linux Torch wheel bundles CUDA components.
multimodal-cpu = [
    "transformers>=4.57.0",
    "qwen-vl-utils>=0.0.14",
    "accelerate>=1.10,<2",
    "Pillow>=10",
    "huggingface_hub>=0.26",
    "bitsandbytes>=0.45",
]
# CUDA Torch must come from an official PyTorch CUDA index selected by the
# installer. Keeping Torch out of this extra prevents pip from silently
# replacing a CUDA wheel with the normal-index CPU wheel.
multimodal-cuda = [
    "transformers>=4.57.0",
    "qwen-vl-utils>=0.0.14",
    "accelerate>=1.10,<2",
    "Pillow>=10",
    "huggingface_hub>=0.26",
    "bitsandbytes>=0.45",
]
# Dependencies for the isolated FastAPI embedding service. Torch is kept
# out of these extras because the selected CPU/CUDA wheel must come from the
# checked-in PyTorch index profile.
embedding-service = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "transformers>=4.57.0",
    "qwen-vl-utils>=0.0.14",
    "accelerate>=1.10,<2",
    "Pillow>=10",
    "huggingface_hub>=0.26",
]
embedding-cpu = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "transformers>=4.57.0",
    "qwen-vl-utils>=0.0.14",
    "accelerate>=1.10,<2",
    "Pillow>=10",
    "huggingface_hub>=0.26",
]
embedding-cuda = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "transformers>=4.57.0",
    "qwen-vl-utils>=0.0.14",
    "accelerate>=1.10,<2",
    "Pillow>=10",
    "huggingface_hub>=0.26",
]
test = [
    "pytest>=8.0",
    "pytest-anyio",
    "sqlalchemy>=2.0",
    "langchain-ollama>=0.3.0",
]
dev = [
    "kogwistar-llm-wiki[test,chromadb,otel,agent]",
]

[project.scripts]
llm-wiki = "kogwistar_llm_wiki.__main__:main"

# ---------------------------------------------------------------------------
# uv-specific: when using `uv`, resolve sibling packages from local paths.
# This section is ignored by pip/setuptools.
# ---------------------------------------------------------------------------
[tool.uv.sources]
# uv resolves these from local paths when available. Ignored by pip/setuptools.
kogwistar               = { path = "kogwistar",               editable = true }
kogwistar-obsidian-sink = { path = "kogwistar-obsidian-sink", editable = true }
# The kg-doc-parser checkout publishes graph-knowledge-doc-parser.
graph-knowledge-doc-parser = { path = "kg-doc-parser", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["kogwistar-llm-wiki-tests-*"]
markers = [
    "manual: tests that are opt-in and may require local services",
    "integration: tests that require real external backends (Chroma, Obsidian vault)",
    "longrun: opt-in long-running workflow/daemon-style soak tests",
    "requires_ollama: tests that require a local Ollama service",
]

[tool.ruff.lint.per-file-ignores]
# These files intentionally import after runtime path/bootstrap setup.
"tests/conftest.py" = ["E402"]
"tests/integration/test_longrun_workflow_ingestion.py" = ["E402"]
"tests/unit/test_embedding_service.py" = ["E402"]
