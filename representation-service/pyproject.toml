[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-representation-service"
version = "0.1.0"
description = "Standalone Qwen3-VL representation service and shared v1 contract"
requires-python = ">=3.13"
dependencies = ["llm-wiki-representation-contract==0.1.0"]

[project.optional-dependencies]
service = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "transformers>=4.57.0",
    "qwen-vl-utils>=0.0.14",
    "accelerate>=1.10,<2",
    "Pillow>=10",
    "huggingface_hub>=0.26",
]

[tool.setuptools]
package-dir = {"" = "../src"}

[tool.setuptools.packages.find]
where = ["../src"]
include = ["llm_wiki_representation_service*"]
