[pytest]
addopts = -p no:tmpdir
pythonpath = .
markers =
    ci: fast pull-request-safe tests
    ci_full: full integration and end-to-end tests
    slow: tests that are intentionally excluded from default CI and run in full CI
    core: core engine tests
    workflow: workflow-layer tests
    conversation: conversation-layer tests
    runtime: runtime engine and parity suites
    runtime_async: async runtime contracts
    runtime_sync: sync runtime contracts
    runtime_bridge_parity: bridge parity contract
    manual: manual smoke tests that require a live service
    e2e: end-to-end tests against real services
    integration: integration tests using real or persistent application backends
    longrun: opt-in long-running workflow and daemon-style tests
    requires_ollama: tests that require a local Ollama service
    llm_real: tests that construct or exercise a real provider SDK
    legacy: legacy tests requiring external assets or historical import layout
testpaths =
    tests
    kg-doc-parser/tests
norecursedirs =
    .git
    .venv
    .pytest*
    .tmp_*
    kogwistar
