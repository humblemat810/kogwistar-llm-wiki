name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The application imports these sibling repositories at runtime. Keep CI
  # aligned with the revisions used by publish-dockerhub.yml.
  KOGWISTAR_REVISION: 3bddf97f402d549c3cf1f34f38c99fcf42bcd02f
  KG_DOC_PARSER_REVISION: 97e6bcc8252415554001fe6f022306d74d28d096
  OBSIDIAN_SINK_REVISION: 30e64d30f04f5b175f9ea3b537c18e0523017398

jobs:
  python-tests:
    name: Provider-free Python tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: cpython312
            python-version: "3.12"
            is_pypy: false
          - label: cpython313
            python-version: "3.13"
            is_pypy: false
          - label: cpython314
            python-version: "3.14"
            is_pypy: false
          - label: pypy311
            python-version: pypy-3.11-v7.3.20
            is_pypy: true
    steps:
      - name: Checkout application
        uses: actions/checkout@v7

      - name: Checkout pinned Kogwistar
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar
          ref: ${{ env.KOGWISTAR_REVISION }}
          path: kogwistar
          persist-credentials: false

      - name: Checkout pinned parser
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kg-doc-parser
          ref: ${{ env.KG_DOC_PARSER_REVISION }}
          path: kg-doc-parser
          persist-credentials: false

      - name: Checkout pinned Obsidian sink
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar-obsidian-sink
          ref: ${{ env.OBSIDIAN_SINK_REVISION }}
          path: kogwistar-obsidian-sink
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Rust for the local Kogwistar package
        if: matrix.is_pypy == false
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1

      - name: Install CPython packages and provider-free test dependencies
        if: matrix.is_pypy == false
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ./kogwistar
          python -m pip install -e ./kg-doc-parser
          python -m pip install -e ./kogwistar-obsidian-sink
          python -m pip install -e ".[test,otel,agent]" --no-deps
          python -m pip install \
            "chromadb>=0.6" \
            "mcp>=1.27,<2" \
            "langchain-openai>=0.3" \
            "langchain-ollama>=0.3" \
            "sqlalchemy>=2.0" \
            "opentelemetry-api>=1.25" \
            "opentelemetry-sdk>=1.25" \
            "opentelemetry-exporter-otlp-proto-http>=1.25" \
            "pytest>=8" \
            "pytest-anyio"

      - name: Install PyPy 3.11 Python-authority profile
        if: matrix.is_pypy
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.implementation.name == "pypy"; assert sys.version_info[:2] == (3, 11); print(sys.implementation); print(sys.version)'
          {
            echo "PYTHONPATH=$GITHUB_WORKSPACE/kogwistar:$GITHUB_WORKSPACE/kg-doc-parser:$GITHUB_WORKSPACE/kogwistar-obsidian-sink:$GITHUB_WORKSPACE/src"
            echo "KOGWISTAR_IMPL_MODE=python"
          } >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
          python -m pip install --no-deps --ignore-requires-python -e .
          python -m pip install -r requirements/pypy-3.11-experimental.txt

      - name: Run CPython provider-free CI marker
        if: matrix.is_pypy == false
        env:
          LLM_WIKI_AUTH_MODE: disabled
          LLM_WIKI_OTEL_ENABLED: "false"
          KOGWISTAR_LOG_LEVEL: WARNING
          LOG_LEVEL: WARNING
        shell: bash
        run: >-
          python -m pytest -m "ci and not ci_full and not slow and not manual and not llm_real and not longrun and not requires_ollama and not requires_chroma" tests -q
          --durations=25 --durations-min=0 --resource-report
          --resource-report-json "test-results/resource-report-${{ matrix.label }}.json"
          -p no:cacheprovider

      - name: Run PyPy 3.11 provider-free CI profile
        if: matrix.is_pypy
        env:
          LLM_WIKI_AUTH_MODE: disabled
          LLM_WIKI_OTEL_ENABLED: "false"
          KOGWISTAR_LOG_LEVEL: WARNING
          LOG_LEVEL: WARNING
        shell: bash
        run: python scripts/run_pypy311_ci.py --skip-install --results-dir test-results/${{ matrix.label }}

      - name: Upload per-runtime resource report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resource-report-${{ matrix.label }}
          path: |
            test-results/resource-report-${{ matrix.label }}.json
            test-results/${{ matrix.label }}/resource-report-pypy311.json
          if-no-files-found: warn

      - name: Publish resource summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="test-results/resource-report-${{ matrix.label }}.json"
          if [ "${{ matrix.is_pypy }}" = "true" ]; then
            report="test-results/${{ matrix.label }}/resource-report-pypy311.json"
          fi
          if test -f "$report"; then
            python scripts/summarize_resource_report.py "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Resource Report" >> "$GITHUB_STEP_SUMMARY"
            echo "Resource report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout application
        uses: actions/checkout@v7

      - name: Checkout pinned Kogwistar
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar
          ref: ${{ env.KOGWISTAR_REVISION }}
          path: kogwistar
          persist-credentials: false

      - name: Checkout pinned parser
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kg-doc-parser
          ref: ${{ env.KG_DOC_PARSER_REVISION }}
          path: kg-doc-parser
          persist-credentials: false

      - name: Checkout pinned Obsidian sink
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar-obsidian-sink
          ref: ${{ env.OBSIDIAN_SINK_REVISION }}
          path: kogwistar-obsidian-sink
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pinned Ruff
        shell: bash
        run: python -m pip install --upgrade pip ruff==0.16.7

      - name: Lint application-owned Python
        shell: bash
        # Keep the application's established Ruff baseline explicit. New Ruff
        # releases must not silently expand CI into legacy style rules.
        run: python -m ruff check src tests scripts --select E4,E7,E9,F

      - name: Lint pinned Kogwistar Python
        shell: bash
        working-directory: kogwistar
        run: python -m ruff check .

  resource-comparison:
    name: Compare Python resource reports
    needs: python-tests
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout application
        uses: actions/checkout@v7

      - name: Set up Python for report rendering
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download per-runtime resource reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: resource-report-cpython-*
          path: test-results/resource-reports
          merge-multiple: true

      - name: Publish cross-runtime resource comparison
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cpython312="test-results/resource-reports/resource-report-cpython312.json"
          cpython313="test-results/resource-reports/resource-report-cpython313.json"
          cpython314="test-results/resource-reports/resource-report-cpython314.json"
          pypy311="test-results/resource-reports/resource-report-pypy311.json"
          if test -f "$cpython312" && test -f "$cpython313" && test -f "$cpython314" && test -f "$pypy311"; then
            python scripts/compare_resource_reports.py \
              --report "cpython312=$cpython312" \
              --report "cpython313=$cpython313" \
              --report "cpython314=$cpython314" \
              --report "pypy311=$pypy311" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Resource Report Comparison" >> "$GITHUB_STEP_SUMMARY"
            echo "All four runtime resource reports were not available." >> "$GITHUB_STEP_SUMMARY"
          fi

  rust:
    name: Kogwistar Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout application
        uses: actions/checkout@v7

      - name: Checkout pinned Kogwistar
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar
          ref: ${{ env.KOGWISTAR_REVISION }}
          path: kogwistar
          persist-credentials: false

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          components: clippy,rustfmt

      - name: Check formatting
        working-directory: kogwistar/rust
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        working-directory: kogwistar/rust
        run: cargo test --workspace --all-targets --locked

      - name: Deny Clippy warnings
        working-directory: kogwistar/rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
