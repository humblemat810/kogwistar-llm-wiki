name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The application imports these sibling repositories at runtime. Keep CI
  # aligned with the revisions used by publish-dockerhub.yml.
  KOGWISTAR_REVISION: 3276b6f2c88dd5330e57b9d3d148f8af021c8f4a
  KG_DOC_PARSER_REVISION: 459afe01a56c8f9916573173ac5c7800fd9fc5d1
  OBSIDIAN_SINK_REVISION: 30e64d30f04f5b175f9ea3b537c18e0523017398

jobs:
  python-tests:
    name: Provider-free Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout application
        uses: actions/checkout@v7

      - name: Checkout pinned Kogwistar
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar
          ref: ${{ env.KOGWISTAR_REVISION }}
          path: kogwistar
          persist-credentials: false

      - name: Checkout pinned parser
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kg-doc-parser
          ref: ${{ env.KG_DOC_PARSER_REVISION }}
          path: kg-doc-parser
          persist-credentials: false

      - name: Checkout pinned Obsidian sink
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar-obsidian-sink
          ref: ${{ env.OBSIDIAN_SINK_REVISION }}
          path: kogwistar-obsidian-sink
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Rust for the local Kogwistar package
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1

      - name: Install local packages and provider-free test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ./kogwistar
          python -m pip install -e ./kg-doc-parser
          python -m pip install -e ./kogwistar-obsidian-sink
          python -m pip install -e ".[test,otel,agent]" --no-deps
          python -m pip install \
            "chromadb>=0.6" \
            "mcp>=1.27,<2" \
            "langchain-openai>=0.3" \
            "langchain-ollama>=0.3" \
            "sqlalchemy>=2.0" \
            "opentelemetry-api>=1.25" \
            "opentelemetry-sdk>=1.25" \
            "opentelemetry-exporter-otlp-proto-http>=1.25" \
            "pytest>=8" \
            "pytest-anyio"

      - name: Run provider-free CI marker
        env:
          LLM_WIKI_AUTH_MODE: disabled
          LLM_WIKI_OTEL_ENABLED: "false"
          KOGWISTAR_LOG_LEVEL: WARNING
          LOG_LEVEL: WARNING
        shell: bash
        run: >-
          python -m pytest -m "ci and not ci_full and not slow and not manual and not llm_real and not longrun and not requires_ollama and not requires_chroma" tests -q
          --durations=25 --durations-min=0 --resource-report
          --resource-report-json "test-results/resource-report-${{ matrix.python-version }}.json"
          -p no:cacheprovider

      - name: Upload per-test resource report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resource-report-cpython-${{ matrix.python-version }}
          path: test-results/resource-report-${{ matrix.python-version }}.json
          if-no-files-found: warn

      - name: Publish resource summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="test-results/resource-report-${{ matrix.python-version }}.json"
          if test -f "$report"; then
            python scripts/summarize_resource_report.py "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Resource Report" >> "$GITHUB_STEP_SUMMARY"
            echo "Resource report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout application
        uses: actions/checkout@v7

      - name: Checkout pinned Kogwistar
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar
          ref: ${{ env.KOGWISTAR_REVISION }}
          path: kogwistar
          persist-credentials: false

      - name: Checkout pinned parser
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kg-doc-parser
          ref: ${{ env.KG_DOC_PARSER_REVISION }}
          path: kg-doc-parser
          persist-credentials: false

      - name: Checkout pinned Obsidian sink
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar-obsidian-sink
          ref: ${{ env.OBSIDIAN_SINK_REVISION }}
          path: kogwistar-obsidian-sink
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pinned Ruff
        shell: bash
        run: python -m pip install --upgrade pip ruff==0.16.7

      - name: Lint application-owned Python
        shell: bash
        # Keep the application's established Ruff baseline explicit. New Ruff
        # releases must not silently expand CI into legacy style rules.
        run: python -m ruff check src tests scripts --select E4,E7,E9,F

      - name: Lint pinned Kogwistar Python
        shell: bash
        working-directory: kogwistar
        run: python -m ruff check .

  resource-comparison:
    name: Compare Python resource reports
    needs: python-tests
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout application
        uses: actions/checkout@v7

      - name: Set up Python for report rendering
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download per-runtime resource reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: resource-report-cpython-*
          path: test-results/resource-reports
          merge-multiple: true

      - name: Publish cross-runtime resource comparison
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          first="test-results/resource-reports/resource-report-cpython-3.12.json"
          second="test-results/resource-reports/resource-report-cpython-3.13.json"
          if test -f "$first" && test -f "$second"; then
            python scripts/compare_resource_reports.py \
              --report "cpython312=$first" \
              --report "cpython313=$second" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Resource Report Comparison" >> "$GITHUB_STEP_SUMMARY"
            echo "Both CPython resource-report artifacts were not available." >> "$GITHUB_STEP_SUMMARY"
          fi

  rust:
    name: Kogwistar Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout application
        uses: actions/checkout@v7

      - name: Checkout pinned Kogwistar
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar
          ref: ${{ env.KOGWISTAR_REVISION }}
          path: kogwistar
          persist-credentials: false

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          components: clippy,rustfmt

      - name: Check formatting
        working-directory: kogwistar/rust
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        working-directory: kogwistar/rust
        run: cargo test --workspace --all-targets --locked

      - name: Deny Clippy warnings
        working-directory: kogwistar/rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
