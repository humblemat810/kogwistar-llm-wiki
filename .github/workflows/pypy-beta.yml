name: Experimental PyPy 3.12 beta

on:
  workflow_dispatch:
    inputs:
      installed_wheel:
        description: Also build and validate non-editable wheels outside the checkout
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Keep the manual profile aligned with the revisions tested by required CI.
  KOGWISTAR_REVISION: 2832399e691d2a4e9c083a266d159d011eb52327
  KG_DOC_PARSER_REVISION: 4c311b71272dea1f16cdae4f95f5fb1e0b4fa690
  OBSIDIAN_SINK_REVISION: 73541e0f7cfe160639f324d84a181faeb0801835

jobs:
  pypy-beta-probe:
    name: PyPy 3.12 beta profile probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This lane is intentionally manual and non-required while PyPy 3.12 is beta.
    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Checkout pinned Kogwistar
        uses: actions/checkout@v4
        with:
          repository: humblemat810/kogwistar
          ref: ${{ env.KOGWISTAR_REVISION }}
          path: kogwistar
          persist-credentials: false

      - name: Checkout pinned parser
        uses: actions/checkout@v4
        with:
          repository: humblemat810/kg-doc-parser
          ref: ${{ env.KG_DOC_PARSER_REVISION }}
          path: kg-doc-parser
          persist-credentials: false

      - name: Checkout pinned Obsidian sink
        uses: actions/checkout@v4
        with:
          repository: humblemat810/kogwistar-obsidian-sink
          ref: ${{ env.OBSIDIAN_SINK_REVISION }}
          path: kogwistar-obsidian-sink
          persist-credentials: false

      - name: Install official PyPy 3.12 beta
        env:
          PYPY_URL: https://buildbot.pypy.org/nightly/py3.12/pypy-c-jit-latest-linux64.tar.gz
        shell: bash
        run: |
          set -euo pipefail
          pypy_home="$RUNNER_TEMP/pypy"
          archive="$RUNNER_TEMP/pypy.tar.gz"
          mkdir -p "$pypy_home"
          echo "Downloading official PyPy beta archive: $PYPY_URL"
          curl --fail --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            "$PYPY_URL" --output "$archive"
          test -s "$archive"
          stat --format='bytes=%s modified=%y' "$archive"
          echo "sha256=$(sha256sum "$archive" | cut -d' ' -f1)"
          tar --extract --gzip --strip-components=1 --file "$archive" \
            --directory "$pypy_home"
          test -x "$pypy_home/bin/pypy3"
          echo "$pypy_home/bin" >> "$GITHUB_PATH"
          "$pypy_home/bin/pypy3" -m ensurepip
          "$pypy_home/bin/pypy3" -m pip install --no-cache-dir --upgrade pip setuptools wheel

      - name: Report interpreter and wheel tags
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -c 'import sys, sysconfig; print(sys.implementation); print(sysconfig.get_platform()); print(sysconfig.get_config_var("SOABI"))'

      - name: Verify NumPy-free Kogwistar source boundary
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import tomllib; from pathlib import Path; d=tomllib.loads(Path("kogwistar/pyproject.toml").read_text(encoding="utf-8")); deps=d["project"]["dependencies"]; assert not any(str(dep).lower().startswith("numpy") for dep in deps), "pinned Kogwistar base dependencies still require NumPy"'

      - name: Install bounded NumPy-free source profile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ./kogwistar --no-deps
          python -m pip install -e ./kg-doc-parser --no-deps
          python -m pip install -e ./kogwistar-obsidian-sink --no-deps
          python -m pip install -e . --no-deps
          python -m pip install -c kogwistar/constraints-pypy-3.12.txt \
            -r requirements/pypy-3.12-beta.txt

      - name: Check NumPy-free profile boundary
        shell: bash
        run: python scripts/check_pypy_profile.py --json --require-import kogwistar --require-import kogwistar_llm_wiki

      - name: Run provider-free PyPy tests
        shell: bash
        env:
          LLM_WIKI_AUTH_MODE: disabled
          LLM_WIKI_OTEL_ENABLED: "false"
          KOGWISTAR_LOG_LEVEL: WARNING
          LOG_LEVEL: WARNING
        run: >-
          python -m pytest
          -m "ci and not ci_full and not slow and not manual and not llm_real and not longrun and not requires_ollama"
          tests -q --durations=25 --durations-min=0 -p no:cacheprovider

      - name: Build and validate installed wheels
        if: inputs.installed_wheel == true
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -euo pipefail
          python -m pip install --upgrade build maturin poetry-core setuptools wheel
          mkdir -p "$RUNNER_TEMP/pypy-wheels"
          python -m pip wheel --no-deps --no-build-isolation \
            ./kogwistar ./kg-doc-parser ./kogwistar-obsidian-sink . \
            --wheel-dir "$RUNNER_TEMP/pypy-wheels"
          python -m venv "$RUNNER_TEMP/pypy-installed"
          "$RUNNER_TEMP/pypy-installed/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pypy-installed/bin/python" -m pip install \
            --no-index --find-links "$RUNNER_TEMP/pypy-wheels" \
            kogwistar graph-knowledge-doc-parser kogwistar-obsidian-sink kogwistar-llm-wiki \
            --no-deps
          "$RUNNER_TEMP/pypy-installed/bin/python" -m pip install \
            -c kogwistar/constraints-pypy-3.12.txt \
            -r requirements/pypy-3.12-beta.txt
          cp scripts/check_pypy_profile.py "$RUNNER_TEMP/check_pypy_profile.py"
          env -u PYTHONPATH "$RUNNER_TEMP/pypy-installed/bin/python" \
            "$RUNNER_TEMP/check_pypy_profile.py" --installed-only --json \
            --require-import kogwistar --require-import kogwistar_llm_wiki

      - name: Report PyPy beta limitation
        run: |
          echo "PyPy 3.12 beta source-profile probe completed. Production support remains opt-in"
          echo "while the native-extension, storage, and installed-wheel gates remain unresolved."
          echo "This lane uses source installs only; installed-wheel validation remains a separate gate."
