name: Full CI

on:
  schedule:
    - cron: "30 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  KOGWISTAR_REVISION: 73fc247b36d2a1128b591502547ead2716d60d4d
  KG_DOC_PARSER_REVISION: ac80637ec6b31fd8f399827b828646f6fe0f91d9
  OBSIDIAN_SINK_REVISION: 36f51e5c23522cd3e467ee49bc7127461b4753c2

jobs:
  full-python:
    name: Full Python suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout application
        uses: actions/checkout@v7

      - name: Checkout pinned Kogwistar
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar
          ref: ${{ env.KOGWISTAR_REVISION }}
          path: kogwistar
          persist-credentials: false

      - name: Checkout pinned parser
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kg-doc-parser
          ref: ${{ env.KG_DOC_PARSER_REVISION }}
          path: kg-doc-parser
          persist-credentials: false

      - name: Checkout pinned Obsidian sink
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar-obsidian-sink
          ref: ${{ env.OBSIDIAN_SINK_REVISION }}
          path: kogwistar-obsidian-sink
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.21"
          enable-cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1

      - name: Expose checked-out package sources
        shell: bash
        run: |
          set -euo pipefail
          echo "PYTHONPATH=$GITHUB_WORKSPACE/kogwistar:$GITHUB_WORKSPACE/kg-doc-parser:$GITHUB_WORKSPACE/kogwistar-obsidian-sink:$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"

      - name: Install full-suite dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --system --no-deps \
            -e ./kogwistar \
            -e ./kg-doc-parser \
            -e ./kogwistar-obsidian-sink \
            -e ".[test,otel,agent]"
          uv pip install --system -r requirements/ci-cpython.txt "chromadb>=0.6"

      - name: Run full deterministic suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          python -m pytest \
            -m "not manual and not llm_real and not longrun and not requires_ollama" \
            tests -q --durations=25 --durations-min=0 \
            --junitxml test-results/junit-full.xml \
            -p no:cacheprovider 2>&1 | tee test-results/pytest-full.log

      - name: Upload full-suite diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-suite-diagnostics
          path: test-results/
          if-no-files-found: warn

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci
