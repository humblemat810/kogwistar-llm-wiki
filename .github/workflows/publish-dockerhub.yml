name: Publish Docker Hub images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm:
        description: Publish the images to Docker Hub
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish-app:
    if: github.event_name == 'push' || inputs.confirm == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Keep the application image reproducible even though these packages are
      # maintained as sibling repositories rather than Git submodules.
      KOGWISTAR_REVISION: 6ff3b2f4c4b84c20b0a6e0db7e5ffb2484ebe792
      KG_DOC_PARSER_REVISION: e8d969ce4f3ef74d2f99c4f6a93dfe29c6b45d13
      OBSIDIAN_SINK_REVISION: 73541e0f7cfe160639f324d84a181faeb0801835
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned sibling packages
        uses: actions/checkout@v4
        with:
          repository: humblemat810/kogwistar
          ref: ${{ env.KOGWISTAR_REVISION }}
          path: kogwistar
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: humblemat810/kg-doc-parser
          ref: ${{ env.KG_DOC_PARSER_REVISION }}
          path: kg-doc-parser
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: humblemat810/kogwistar-obsidian-sink
          ref: ${{ env.OBSIDIAN_SINK_REVISION }}
          path: kogwistar-obsidian-sink
          persist-credentials: false
      - name: Validate Docker build context
        shell: bash
        run: |
          set -euo pipefail
          test -f kogwistar/pyproject.toml
          test -f kg-doc-parser/pyproject.toml
          test -f kogwistar-obsidian-sink/pyproject.toml
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kogwistar-llm-wiki
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=llm-wiki
          cache-to: type=gha,mode=max,scope=llm-wiki
