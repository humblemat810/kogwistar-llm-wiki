name: Publish Docker Hub images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm:
        description: Publish the images to Docker Hub
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish-app:
    if: github.event_name == 'push' || inputs.confirm == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kogwistar-llm-wiki
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=llm-wiki
          cache-to: type=gha,mode=max,scope=llm-wiki

  publish-representation-cpu:
    if: github.event_name == 'push' || inputs.confirm == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kogwistar-llm-wiki-embedding
          tags: |
            type=semver,pattern={{version}}-cpu
            type=raw,value=cpu
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.representation-service
          build-args: LLM_WIKI_REPRESENTATION_TORCH_BACKEND=cpu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=representation-cpu
          cache-to: type=gha,mode=max,scope=representation-cpu

  publish-representation-cuda:
    if: github.event_name == 'push' || inputs.confirm == true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kogwistar-llm-wiki-embedding
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=cuda12.8
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.representation-service
          build-args: LLM_WIKI_REPRESENTATION_TORCH_BACKEND=cu128
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=representation-cuda12.8
          cache-to: type=gha,mode=max,scope=representation-cuda12.8
