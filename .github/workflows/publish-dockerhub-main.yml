name: Publish Docker Hub main image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish-main:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Keep the post-CI image reproducible even though these packages are
      # maintained as sibling repositories rather than Git submodules.
      KOGWISTAR_REVISION: 82bcd0544fa878a4082e40aba070b5f266c122e2
      KG_DOC_PARSER_REVISION: e7e42760e5578cce7d362b5b0e00996527e2ecbf
      OBSIDIAN_SINK_REVISION: bb9cec922c156465af8395e0dfb3b3cf76748f5f
    steps:
      - name: Check out tested application commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check out pinned sibling packages
        uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar
          ref: ${{ env.KOGWISTAR_REVISION }}
          path: kogwistar
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: humblemat810/kg-doc-parser
          ref: ${{ env.KG_DOC_PARSER_REVISION }}
          path: kg-doc-parser
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: humblemat810/kogwistar-obsidian-sink
          ref: ${{ env.OBSIDIAN_SINK_REVISION }}
          path: kogwistar-obsidian-sink
          persist-credentials: false
      - name: Validate Docker build context
        shell: bash
        run: |
          set -euo pipefail
          test -f kogwistar/pyproject.toml
          test -f kg-doc-parser/pyproject.toml
          test -f kogwistar-obsidian-sink/pyproject.toml
      - name: Verify Docker Hub namespace
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kogwistar-llm-wiki
          tags: |
            type=raw,value=main
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=llm-wiki-main
          cache-to: type=gha,mode=max,scope=llm-wiki-main
