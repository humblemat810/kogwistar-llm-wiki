# Additive combined-mode overlay. Use with compose.yml and, when needed,
# compose.embedding-vllm.yml. It changes the REST container into one process
# serving REST, streamable MCP, and the maintenance daemon over shared engines.
services:
  rest:
    mem_limit: ${LLM_WIKI_COMBINED_MEMORY_LIMIT:-512m}
    cpus: ${LLM_WIKI_COMBINED_CPU_LIMIT:-0.25}
    environment:
      LLM_WIKI_MAINTENANCE_ENABLED: ${LLM_WIKI_MAINTENANCE_ENABLED:-false}
      LLM_WIKI_MAINTENANCE_REQUEST_ENABLED: ${LLM_WIKI_MAINTENANCE_REQUEST_ENABLED:-true}
      LLM_WIKI_MAINTENANCE_BACKGROUND_ENABLED: ${LLM_WIKI_MAINTENANCE_BACKGROUND_ENABLED:-false}
      LLM_WIKI_MAINTENANCE_PROFILE: ${LLM_WIKI_MAINTENANCE_PROFILE:-balanced}
      LLM_WIKI_MAINTENANCE_PROFILE_LADDER: ${LLM_WIKI_MAINTENANCE_PROFILE_LADDER:-}
      LLM_WIKI_MAINTENANCE_MODEL_CLASS: ${LLM_WIKI_MAINTENANCE_MODEL_CLASS:-unknown}
      LLM_WIKI_MAINTENANCE_TOKEN_BUDGET_RATE: ${LLM_WIKI_MAINTENANCE_TOKEN_BUDGET_RATE:-100000}
      LLM_WIKI_MAINTENANCE_BUDGET_DAILY_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_DAILY_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_DAILY_INPUT_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_DAILY_INPUT_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_DAILY_OUTPUT_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_DAILY_OUTPUT_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_DAILY_MONEY: ${LLM_WIKI_MAINTENANCE_BUDGET_DAILY_MONEY:-}
      LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_INPUT_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_INPUT_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_OUTPUT_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_OUTPUT_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_MONEY: ${LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_MONEY:-}
      LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_INPUT_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_INPUT_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_OUTPUT_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_OUTPUT_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_MONEY: ${LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_MONEY:-}
      LLM_WIKI_MAINTENANCE_BUDGET_CURRENCY: ${LLM_WIKI_MAINTENANCE_BUDGET_CURRENCY:-USD}
      LLM_WIKI_MAINTENANCE_PRICE_INPUT_PER_1M: ${LLM_WIKI_MAINTENANCE_PRICE_INPUT_PER_1M:-}
      LLM_WIKI_MAINTENANCE_PRICE_OUTPUT_PER_1M: ${LLM_WIKI_MAINTENANCE_PRICE_OUTPUT_PER_1M:-}
      LLM_WIKI_MAINTENANCE_BUDGET_WINDOW_MODE: ${LLM_WIKI_MAINTENANCE_BUDGET_WINDOW_MODE:-rolling}
    command:
      - llm-wiki
      - --data-dir
      - /var/lib/llm-wiki
      - --backend
      - postgres
      - serve
      - --workspace
      - ${LLM_WIKI_WORKSPACE:-default}
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --mcp-port
      - "8780"
      - --mcp-path
      - /mcp
      - --maintenance-interval
      - ${LLM_WIKI_MAINTENANCE_POLL_INTERVAL:-10}
      - --background-interval
      - ${LLM_WIKI_MAINTENANCE_BACKGROUND_INTERVAL:-600}
    ports:
      - "127.0.0.1:${LLM_WIKI_REST_PORT:-8765}:8765"
      - "127.0.0.1:${LLM_WIKI_MCP_PORT:-8780}:8780"

  # These services remain available for the split deployment but are not
  # started when this overlay is selected.
  mcp:
    profiles: [split]
  maintenance:
    profiles: [split]
