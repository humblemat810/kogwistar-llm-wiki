# OVERLAY ONLY: this file is not a standalone Compose application.
# It requires compose.yml first, and compose.multimodal.yml when multimodal
# retrieval is enabled. The base file provides PostgreSQL, REST, and MCP.
# Development/operator example: PostgreSQL-backed multimodal memory agent.
#
# Start with the base app, the Qwen3-VL sidecar, and this observability overlay:
#   docker compose -f compose.yml -f compose.embedding-vllm.yml \
#     -f compose.memory-agent.yml up --build
# The custom Transformers reference can be selected instead with
# compose.multimodal.yml (do not combine both embedding overlays).
#
# This file is intentionally an example. Keep credentials in .env or a secret
# manager; do not commit a working token.
services:
  maintenance:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${LLM_WIKI_IMAGE:-kogwistar-llm-wiki:local}
    mem_limit: ${LLM_WIKI_MAINTENANCE_MEMORY_LIMIT:-512m}
    cpus: ${LLM_WIKI_MAINTENANCE_CPU_LIMIT:-0.20}
    depends_on:
      postgres:
        condition: service_healthy
      app-data-init:
        condition: service_completed_successfully
      grafana:
        condition: service_started
    environment:
      KOGWISTAR_DATA_DIR: /var/lib/llm-wiki
      KOGWISTAR_POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER:-llm_wiki}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}@postgres:5432/${POSTGRES_DB:-llm_wiki}
      LLM_WIKI_AUTH_MODE: ${LLM_WIKI_AUTH_MODE:-static_token}
      LLM_WIKI_AUTH_REQUIRED: ${LLM_WIKI_AUTH_REQUIRED:-true}
      LLM_WIKI_API_TOKEN: ${LLM_WIKI_API_TOKEN:?Set LLM_WIKI_API_TOKEN in .env}
      LLM_WIKI_MCP_TOKEN: ${LLM_WIKI_MCP_TOKEN:-${LLM_WIKI_API_TOKEN}}
      LLM_WIKI_OTEL_ENABLED: ${LLM_WIKI_OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana:4318
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://grafana:4318/v1/traces
      KOGWISTAR_MAINTENANCE_PROVIDER: ${KOGWISTAR_MAINTENANCE_PROVIDER:-ollama}
      KOGWISTAR_MAINTENANCE_PROVIDER_CHAIN: ${KOGWISTAR_MAINTENANCE_PROVIDER_CHAIN:-ollama}
      KOGWISTAR_MAINTENANCE_MODEL: ${KOGWISTAR_MAINTENANCE_MODEL:-gemma4:e2b}
      KOGWISTAR_MAINTENANCE_BASE_URL: ${KOGWISTAR_MAINTENANCE_BASE_URL:-http://host.docker.internal:11434}
      KOGWISTAR_MAINTENANCE_CODEX_MODEL: ${KOGWISTAR_MAINTENANCE_CODEX_MODEL:-}
      KOGWISTAR_MAINTENANCE_CODEX_BASE_URL: ${KOGWISTAR_MAINTENANCE_CODEX_BASE_URL:-http://host.docker.internal:8791}
      KOGWISTAR_MAINTENANCE_CODEX_API_KEY_ENV: ${KOGWISTAR_MAINTENANCE_CODEX_API_KEY_ENV:-LLM_WIKI_CODEX_BRIDGE_TOKEN}
      KOGWISTAR_MAINTENANCE_CODEX_TIMEOUT_SECONDS: ${KOGWISTAR_MAINTENANCE_CODEX_TIMEOUT_SECONDS:-300}
      LLM_WIKI_CODEX_BRIDGE_TOKEN: ${LLM_WIKI_CODEX_BRIDGE_TOKEN-}
      LLM_WIKI_MAINTENANCE_DEFAULT_REQUEST_MAX_ROUNDS: ${LLM_WIKI_MAINTENANCE_DEFAULT_REQUEST_MAX_ROUNDS:-2}
      LLM_WIKI_MAINTENANCE_ENABLED: ${LLM_WIKI_MAINTENANCE_ENABLED:-false}
      LLM_WIKI_MAINTENANCE_REQUEST_ENABLED: ${LLM_WIKI_MAINTENANCE_REQUEST_ENABLED:-true}
      LLM_WIKI_MAINTENANCE_BACKGROUND_ENABLED: ${LLM_WIKI_MAINTENANCE_BACKGROUND_ENABLED:-false}
      LLM_WIKI_MAINTENANCE_PROFILE: ${LLM_WIKI_MAINTENANCE_PROFILE:-balanced}
      LLM_WIKI_MAINTENANCE_PROFILE_LADDER: ${LLM_WIKI_MAINTENANCE_PROFILE_LADDER:-}
      LLM_WIKI_MAINTENANCE_MODEL_CLASS: ${LLM_WIKI_MAINTENANCE_MODEL_CLASS:-unknown}
      LLM_WIKI_MAINTENANCE_TOKEN_BUDGET_RATE: ${LLM_WIKI_MAINTENANCE_TOKEN_BUDGET_RATE:-100000}
      LLM_WIKI_MAINTENANCE_BUDGET_DAILY_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_DAILY_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_DAILY_INPUT_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_DAILY_INPUT_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_DAILY_OUTPUT_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_DAILY_OUTPUT_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_DAILY_MONEY: ${LLM_WIKI_MAINTENANCE_BUDGET_DAILY_MONEY:-}
      LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_INPUT_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_INPUT_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_OUTPUT_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_OUTPUT_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_MONEY: ${LLM_WIKI_MAINTENANCE_BUDGET_WEEKLY_MONEY:-}
      LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_INPUT_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_INPUT_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_OUTPUT_TOKENS: ${LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_OUTPUT_TOKENS:-}
      LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_MONEY: ${LLM_WIKI_MAINTENANCE_BUDGET_MONTHLY_MONEY:-}
      LLM_WIKI_MAINTENANCE_BUDGET_CURRENCY: ${LLM_WIKI_MAINTENANCE_BUDGET_CURRENCY:-USD}
      LLM_WIKI_MAINTENANCE_PRICE_INPUT_PER_1M: ${LLM_WIKI_MAINTENANCE_PRICE_INPUT_PER_1M:-}
      LLM_WIKI_MAINTENANCE_PRICE_OUTPUT_PER_1M: ${LLM_WIKI_MAINTENANCE_PRICE_OUTPUT_PER_1M:-}
      LLM_WIKI_MAINTENANCE_BUDGET_WINDOW_MODE: ${LLM_WIKI_MAINTENANCE_BUDGET_WINDOW_MODE:-rolling}
    command:
      - llm-wiki
      - --data-dir
      - /var/lib/llm-wiki
      - --backend
      - postgres
      - daemon
      - maintenance
      - --workspace
      - ${LLM_WIKI_WORKSPACE:-default}
      - --interval
      - ${LLM_WIKI_MAINTENANCE_POLL_INTERVAL:-10}
      - --background-interval
      - ${LLM_WIKI_MAINTENANCE_BACKGROUND_INTERVAL:-600}
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/lib/llm-wiki/maintenance/maintenance.sock"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - app_data:/var/lib/llm-wiki
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  rest:
    depends_on:
      grafana:
        condition: service_started
    environment:
      LLM_WIKI_AGENT_API_ENABLED: "true"
      LLM_WIKI_OTEL_ENABLED: ${LLM_WIKI_OTEL_ENABLED:-true}
      LLM_WIKI_OTEL_SERVICE_NAME: ${LLM_WIKI_OTEL_SERVICE_NAME:-llm-wiki-memory}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana:4318
      LLM_WIKI_AUTH_MODE: ${LLM_WIKI_AUTH_MODE:-static_token}
      LLM_WIKI_AUTH_REQUIRED: ${LLM_WIKI_AUTH_REQUIRED:-true}
      LLM_WIKI_API_TOKEN: ${LLM_WIKI_API_TOKEN:?Set LLM_WIKI_API_TOKEN in .env}

  mcp:
    depends_on:
      grafana:
        condition: service_started
    environment:
      LLM_WIKI_OTEL_ENABLED: ${LLM_WIKI_OTEL_ENABLED:-true}
      LLM_WIKI_OTEL_SERVICE_NAME: ${LLM_WIKI_OTEL_SERVICE_NAME:-llm-wiki-memory-mcp}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana:4318
      LLM_WIKI_AUTH_MODE: ${LLM_WIKI_AUTH_MODE:-static_token}
      LLM_WIKI_AUTH_REQUIRED: ${LLM_WIKI_AUTH_REQUIRED:-true}
      LLM_WIKI_MCP_AUTH_REQUIRED: ${LLM_WIKI_MCP_AUTH_REQUIRED:-true}
      LLM_WIKI_API_TOKEN: ${LLM_WIKI_API_TOKEN:?Set LLM_WIKI_API_TOKEN in .env}
      LLM_WIKI_MCP_TOKEN: ${LLM_WIKI_MCP_TOKEN:-${LLM_WIKI_API_TOKEN}}

  # Grafana OTEL-LGTM is a convenient local collector plus Grafana viewer.
  # Replace this with a separately managed collector/Grafana stack in prod.
  grafana:
    image: grafana/otel-lgtm:latest
    mem_limit: ${LLM_WIKI_GRAFANA_MEMORY_LIMIT:-512m}
    cpus: ${LLM_WIKI_GRAFANA_CPU_LIMIT:-0.15}
    ports:
      - "127.0.0.1:${LLM_WIKI_GRAFANA_PORT:-3000}:3000"
    expose:
      - "4318"

  # Optional local OAuth/OIDC provider for integration testing.
  # Uncomment the whole service to run Keycloak, then configure the app's
  # kogwistar_jwt mode with a compatible issuer, audience, and verification key.
  # Starting Keycloak alone does NOT switch LLM-Wiki authentication on.
  #
  # keycloak:
  #   image: quay.io/keycloak/keycloak:latest
  #   mem_limit: ${LLM_WIKI_OAUTH_MEMORY_LIMIT:-256m}
  #   cpus: ${LLM_WIKI_OAUTH_CPU_LIMIT:-0.10}
  #   command: start-dev
  #   environment:
  #     KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME}
  #     KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
  #   ports:
  #     - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
