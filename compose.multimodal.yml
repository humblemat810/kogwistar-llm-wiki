# Isolated Qwen3-VL representation service.
#
# CPU:
#   docker compose -f compose.yml -f compose.multimodal.yml up --build
# CUDA:
#   LLM_WIKI_REPRESENTATION_TORCH_BACKEND=cu128 \
#   docker compose -f compose.yml -f compose.multimodal.yml up --build
services:
  representation:
    build:
      context: .
      dockerfile: Dockerfile.representation-service
      args:
        LLM_WIKI_REPRESENTATION_TORCH_BACKEND: ${LLM_WIKI_REPRESENTATION_TORCH_BACKEND:-cpu}
    image: ${LLM_WIKI_REPRESENTATION_IMAGE:-kogwistar-llm-wiki-representation:local}
    environment:
      LLM_WIKI_REPRESENTATION_MODEL: ${LLM_WIKI_REPRESENTATION_MODEL:-Qwen/Qwen3-VL-Embedding-2B}
      LLM_WIKI_REPRESENTATION_MODEL_REVISION: ${LLM_WIKI_REPRESENTATION_MODEL_REVISION:-}
      LLM_WIKI_REPRESENTATION_DIMENSION: ${LLM_WIKI_REPRESENTATION_DIMENSION:-1024}
      LLM_WIKI_REPRESENTATION_DEVICE: ${LLM_WIKI_REPRESENTATION_DEVICE:-cpu}
      LLM_WIKI_REPRESENTATION_TORCH_BACKEND: ${LLM_WIKI_REPRESENTATION_TORCH_BACKEND:-cpu}
      LLM_WIKI_REPRESENTATION_TOKEN: ${LLM_WIKI_REPRESENTATION_TOKEN:-}
      HF_HOME: /var/lib/huggingface
    volumes:
      - representation_hf_cache:/var/lib/huggingface
    expose:
      - "8790"
  rest:
    depends_on:
      representation:
        condition: service_started
    environment:
      LLM_WIKI_REPRESENTATION_SERVICE_URL: http://representation:8790
      LLM_WIKI_REPRESENTATION_SERVICE_TOKEN: ${LLM_WIKI_REPRESENTATION_TOKEN:-}
      LLM_WIKI_REPRESENTATION_SERVICE_ALLOWED_HOSTS: representation
      LLM_WIKI_REPRESENTATION_PROFILE_FINGERPRINT: ${LLM_WIKI_REPRESENTATION_PROFILE_FINGERPRINT:-}
      LLM_WIKI_MULTIMODAL_MODEL: ${LLM_WIKI_REPRESENTATION_MODEL:-Qwen/Qwen3-VL-Embedding-2B}
      LLM_WIKI_MULTIMODAL_DIMENSION: ${LLM_WIKI_REPRESENTATION_DIMENSION:-1024}
      LLM_WIKI_MULTIMODAL_MODEL_REVISION: ${LLM_WIKI_REPRESENTATION_MODEL_REVISION:-}
      LLM_WIKI_MULTIMODAL_BACKEND: none

  mcp:
    depends_on:
      representation:
        condition: service_started
    environment:
      LLM_WIKI_REPRESENTATION_SERVICE_URL: http://representation:8790
      LLM_WIKI_REPRESENTATION_SERVICE_TOKEN: ${LLM_WIKI_REPRESENTATION_TOKEN:-}
      LLM_WIKI_REPRESENTATION_SERVICE_ALLOWED_HOSTS: representation
      LLM_WIKI_REPRESENTATION_PROFILE_FINGERPRINT: ${LLM_WIKI_REPRESENTATION_PROFILE_FINGERPRINT:-}
      LLM_WIKI_MULTIMODAL_MODEL: ${LLM_WIKI_REPRESENTATION_MODEL:-Qwen/Qwen3-VL-Embedding-2B}
      LLM_WIKI_MULTIMODAL_DIMENSION: ${LLM_WIKI_REPRESENTATION_DIMENSION:-1024}
      LLM_WIKI_MULTIMODAL_MODEL_REVISION: ${LLM_WIKI_REPRESENTATION_MODEL_REVISION:-}
      LLM_WIKI_MULTIMODAL_BACKEND: none

volumes:
  representation_hf_cache:
